<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Panda Bestfriend Proposal 🐼❤️</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
}

body{
    margin:0;
    font-family: Arial, sans-serif;
    text-align:center;
    overflow:hidden;
    background: linear-gradient(135deg,#ff758c,#ff7eb3);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    position:relative;
}

h1{
    color:white;
    font-size:22px;
    padding:0 15px;
}

.panda{
    font-size:80px;
    margin:20px 0;
    animation:bounce 1s infinite;
}

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
}
.btn-container{
    position:absolute;
    bottom:15%;
    display:flex;
    gap:20px;
}
.btn{
    width:130px;
    height:50px;
    font-size:14px;
    border:none;
    border-radius:25px;
    cursor:pointer;
    position:absolute;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    transition:0.25s ease;
}

#yesBtn{
    background:#ff0066;
    color:white;
    bottom:15%;
    left:15%;
}

#noBtn{
    background:pink;
    color:white;
    bottom:15%;
    right:15%;
}

/* Hearts */
.heart{
    position:absolute;
    font-size:22px;
    animation:fall linear infinite;
}

@keyframes fall{
    0%{transform:translateY(-10vh);opacity:1;}
    100%{transform:translateY(110vh);opacity:0;}
}

/* Popup */
.popup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(0);
    background:white;
    padding:25px;
    border-radius:20px;
    width:85%;
    max-width:340px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
    font-size:16px;
    color:#ff0066;
    animation:pop 0.6s forwards;
}

@keyframes pop{
    0%{transform:translate(-50%,-50%) scale(0);}
    60%{transform:translate(-50%,-50%) scale(1.1);}
    100%{transform:translate(-50%,-50%) scale(1);}
}

</style>
</head>

<body>

<h1>Will You Be My Bestfriend? ❤️</h1>

<div id="panda" class="panda">🐼😊</div>

<button id="yesBtn" class="btn" onclick="yesClicked()">Yes 💖</button>
<button id="noBtn" class="btn">No 😜</button>

<script>

let noCount = 0;
let noBtn = document.getElementById("noBtn");
let panda = document.getElementById("panda");
let yesBtn = document.getElementById("yesBtn");

/* Mobile Tap + Desktop Hover */
noBtn.addEventListener("touchstart", moveNo);
noBtn.addEventListener("mouseover", moveNo);

function moveNo(){

    noCount++;

    let maxX = window.innerWidth - 140;
    let maxY = window.innerHeight - 100;

    let x = Math.random() * maxX;
    let y = Math.random() * maxY;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";

    // Panda emotions
    if(noCount==1) panda.innerHTML="🐼😟";
    else if(noCount==2) panda.innerHTML="🐼🥺";
    else if(noCount==3) panda.innerHTML="🐼😢";
    else if(noCount==4) panda.innerHTML="🐼😭";
    else if(noCount==5){
        panda.innerHTML="🐼😔";
        noBtn.innerHTML="Fir soch lo 😌";
        noBtn.style.background="#ff9900";
    }
    else if(noCount==10){
        panda.innerHTML="🐼🥺";
        noBtn.innerHTML="Ek baar soch lo 🥺";
        noBtn.style.background="#ff4d6d";
    }
    else if(noCount==15){
        panda.innerHTML="🐼😭💔";
        noBtn.innerHTML="Please maan jao 🥺";
        noBtn.style.background="red";
    }
    else if(noCount>18){
        panda.innerHTML="🐼🥹";
        noBtn.innerHTML="Ab toh haan bol do ❤️";
    }

    // Yes button grow smoothly
    yesBtn.style.transform="scale("+(1+noCount*0.06)+")";
}

function yesClicked(){

    document.body.innerHTML="";
    document.body.style.background="black";

    setInterval(createHeart,200);

    let note=document.createElement("div");
    note.className="popup";
    note.innerHTML=`
    🥺💖 You Said YES! 💖🥺<br><br>
    You are my bestfriend & my happiness ✨You are not just my best friend, you are my safe place.
    In a world full of temporary people, you are my permanent comfort.
    Thank you for understanding my silence,and standing beside me even when I don’t say what I feel.
    Life feels lighter, happier, and more beautiful because you are in it.
    No matter where life takes us, I promise our bond will always stay strong.
    I’m truly lucky to have you. 💛<br><br>
    I promise I'll always stay by your side 🤝❤️<br><br>
    Forever Besties 💞
    `;
    document.body.appendChild(note);
}

function createHeart(){
    let heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤️";
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(3+Math.random()*3)+"s";
    document.body.appendChild(heart);

    setTimeout(()=>{heart.remove();},6000);
}

</script>

</body>
</html>
